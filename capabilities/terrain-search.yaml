naftiko: 1.0.0-alpha2
info:
  label: Terrain Discovery Environment API — Search
  description: 'Terrain Discovery Environment API — Search. 1 operations. Lead operation: Search Filesystem. Self-contained
    Naftiko capability covering one Terrain Discovery Environment Api business surface.'
  tags:
  - Terrain Discovery Environment Api
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TERRAIN_DISCOVERY_ENVIRONMENT_API_API_KEY: TERRAIN_DISCOVERY_ENVIRONMENT_API_API_KEY
capability:
  consumes:
  - type: http
    namespace: terrain-search
    baseUri: https://de.cyverse.org/terrain
    description: Terrain Discovery Environment API — Search business capability. Self-contained, no shared references.
    resources:
    - name: secured-filesystem-search
      path: /secured/filesystem/search
      operations:
      - name: searchfilesystem
        method: GET
        description: Search Filesystem
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: search
          in: query
          type: string
          description: Search query string
          required: true
        - name: limit
          in: query
          type: integer
          description: Maximum results to return
        - name: offset
          in: query
          type: integer
          description: Pagination offset
        - name: type
          in: query
          type: string
          description: Filter by object type
    authentication:
      type: bearer
      token: '{{env.TERRAIN_DISCOVERY_ENVIRONMENT_API_API_KEY}}'
  exposes:
  - type: rest
    namespace: terrain-search-rest
    port: 8080
    description: REST adapter for Terrain Discovery Environment API — Search. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/secured/filesystem/search
      name: secured-filesystem-search
      description: REST surface for secured-filesystem-search.
      operations:
      - method: GET
        name: searchfilesystem
        description: Search Filesystem
        call: terrain-search.searchfilesystem
        with:
          search: rest.search
          limit: rest.limit
          offset: rest.offset
          type: rest.type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: terrain-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for Terrain Discovery Environment API — Search. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: search-filesystem
      description: Search Filesystem
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: terrain-search.searchfilesystem
      with:
        search: tools.search
        limit: tools.limit
        offset: tools.offset
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
